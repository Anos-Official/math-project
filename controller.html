<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Math Match Controller</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="controller.css"></head><body><main><header><span class="dot" id="statusDot"></span><span id="status">Not connected</span></header><h1>MATH<br><em>MATCH</em></h1><section class="setup" id="setup"><label>Render server<input id="server" placeholder="wss://your-service.onrender.com/ws"></label><label>Room<input id="room" value="math-match"></label><label>Controller key<input id="key" type="password" placeholder="Your Render secret"></label><button id="connect">Connect</button></section><section class="remote" id="remote" hidden><p id="slide">SLIDE 1 / 7</p><button class="next" id="next">NEXT <span>→</span></button><div class="row"><button id="prev">← BACK</button><button class="reset" id="reset">START OVER</button></div><button class="disconnect" id="disconnect">Disconnect</button></section></main><script src="controller.js"></script></body></html>
